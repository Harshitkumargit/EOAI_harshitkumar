[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eoasset"
version = "1.0.0"
description = "Reproducible Sentinel-2 vegetation forecasting data story"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eoasset = ["dashboard.html"]
